  &lt;p class=&quot;text-small text-muted&quot;&gt;A kisebb ΔE00 jobb színegyezést jelent. A pontokra kattintva is léptethetsz. A pigmenttér öt dimenziós: a kétdimenziós vetületben különböző receptek egymásra kerülhetnek. Az öt cseppszám a teljes receptet mutatja. Az üres edénynek nincs színe és céltávolsága.&lt;/p&gt;
  &lt;details&gt;
    &lt;summary class=&quot;text-small&quot;&gt;Adatforrás és jelölések&lt;/summary&gt;
    &lt;p id=&quot;sr-scope&quot; class=&quot;text-small&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;text-small&quot;&gt;A színfigyelő mindig a kijelölt lépés aktuális keverékét hasonlítja a célhoz. A rögzített végeredmény a teljes próba naplózott lezárása, ezért lejátszás közben is változatlan. perfect: automatikus perfect lezárás; identical: a játékos nem észlelt különbséget; acceptable: elfogadhatónak ítélte; unacceptable: túl nagynak ítélte a különbséget; stopped: megszakított/újrakezdett próba. unknown esetén nincs ellenőrizhetően kapcsolt minősítés. Az identical/acceptable/unacceptable címkék a forrás no_perceivable_difference/acceptable_difference/big_difference kategóriáinak felelnek meg.&lt;/p&gt;
    &lt;p class=&quot;text-small&quot;&gt;A Végeredmény mezőben perfect, identical vagy acceptable lezárásra is szűrhetsz. A színcsaládok, célszínek és színminták ekkor az ilyen próbákhoz tartozó választásokat mutatják. A Minden végeredmény az összes lezárást visszahozza. A próbálkozások sorszáma a kiválasztott célszínre vagy színcsaládra eső, itt elérhető próbák időrendje; a végeredményszűrés ezeket a számokat megtartja, nem számozza át. A személyenkénti első tíz validált próba kimarad; a validált és eredeti játéksorszám külön látható. A színcsaládok a célszín RGB-színezetéből képzett, tájékozódást segítő csoportok. A kis CIELAB-kromatikusságú színek a semleges csoportba kerülnek.&lt;/p&gt;
    &lt;p class=&quot;text-small&quot;&gt;A Lejátszás a kijelölt lépéstől halad a próba végéig, majd megáll. Az Elejére visszaugrik a kezdetre. Kézi léptetés vagy új választás szünetelteti a lejátszást. A sebesség a lépések megjelenítési üteme, nem az eredeti reakcióidő. Egy pont egy megfigyelt állapot; az animáció az állapotok közti átmenetet szemlélteti. A vastag vonal a kijelölésig megtett út, a halvány folytatás a próba hátralévő része. A vékony sugarak a kijelölt receptből megtehető egycseppes hozzáadások és elvételek; a halvány pontok a bejárt út egylépéses környezetéből származnak. Ezek számított lehetőségek, nem megfigyelt emberi döntések. A vonalak diszkrét állapotokat kötnek össze. Naplósorszámrésnél és üres állapotnál a színtéri vonal megszakad. Az RGB-színek az alkalmazás saját Mixbox motorjából származnak; a kijelzőn való megjelenés nem kalibrált színminta. A CIELAB-térbeli egyenes távolság és a ΔE00 eltérő mérték.&lt;/p&gt;

#shade-route-viewer{color:var(--foreground);padding:8px 8px 24px;max-width:none}
#shade-route-viewer h1{margin:0 0 18px}
#shade-route-viewer h2{margin:0 0 4px}
#shade-route-viewer .sr-pickers{display:grid;grid-template-columns:minmax(125px,.8fr) minmax(135px,.85fr) minmax(150px,1fr) minmax(165px,1.1fr) minmax(205px,1.4fr);gap:14px}
#shade-route-viewer #sr-empty{margin:20px 0}
#shade-route-viewer .sr-filter-preview[hidden]{display:none}
#shade-route-viewer .sr-pickers label{min-width:0}
#shade-route-viewer .sr-pickers select{width:100%}
#shade-route-viewer .sr-step-controls{margin:18px 0 22px}
#shade-route-viewer .sr-filter-preview{display:flex;align-items:center;gap:10px;margin-top:12px}
#shade-route-viewer .sr-filter-preview .sr-swatch{width:26px;height:26px}
#shade-route-viewer .sr-target-palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:12px 0}
#shade-route-viewer .sr-palette-swatch{display:inline-block;width:24px;height:24px;flex:none;outline:1px solid var(--border)}
#shade-route-viewer .sr-playback-controls{display:grid;grid-template-columns:max-content minmax(100px,160px) auto;gap:12px;align-items:center;justify-content:start;margin:8px 0}
#shade-route-viewer .sr-zoom{justify-content:flex-start;margin-top:8px}
#shade-route-viewer .sr-step-heading{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
#shade-route-viewer #sr-status{margin-top:8px;min-height:24px}
#shade-route-viewer #sr-trial-info{margin-top:8px;overflow-wrap:anywhere}
#shade-route-viewer .sr-spaces{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px}
#shade-route-viewer .sr-live-monitor{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:center;margin:0 0 22px}
#shade-route-viewer .sr-live-labels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;overflow-wrap:anywhere}
#shade-route-viewer .sr-live-patches{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin:6px 0;outline:1px solid var(--border)}
#shade-route-viewer .sr-live-patch{height:76px;display:flex;align-items:center;justify-content:center;background:var(--muted);color:var(--foreground)}
#shade-route-viewer .sr-live-readout{display:grid;gap:7px}
#shade-route-viewer .sr-ending strong{font-weight:500}
#shade-route-viewer section{min-width:0}
#shade-route-viewer .sr-plot{width:100%;height:470px;margin-top:8px}
#shade-route-viewer .sr-distance{height:210px;width:100%;margin-top:12px}
#shade-route-viewer .sr-chart{display:block;overflow:visible}
#shade-route-viewer .sr-chart text{fill:var(--foreground);font-size:12px;font-weight:400}
#shade-route-viewer .sr-chart .domain,#shade-route-viewer .sr-chart .tick line{stroke:var(--border)}
#shade-route-viewer .sr-frame{fill:none;stroke:var(--border);stroke-width:1}
#shade-route-viewer .sr-route{fill:none;stroke:var(--viz-series-1);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
#shade-route-viewer .sr-ray{stroke:var(--muted-foreground);stroke-width:1;opacity:.5}
#shade-route-viewer .sr-point{stroke:var(--foreground);stroke-width:.6}
#shade-route-viewer .sr-active{fill:none;stroke:var(--viz-series-1);stroke-width:3}
#shade-route-viewer .sr-halo{fill:none;stroke:var(--background);stroke-width:6}
#shade-route-viewer .sr-counts{display:grid;gap:8px;margin-top:14px}
#shade-route-viewer .sr-count-row{display:grid;grid-template-columns:64px minmax(0,1fr) 36px;gap:10px;align-items:center}
#shade-route-viewer .sr-track{height:9px;background:var(--muted)}
#shade-route-viewer .sr-fill{height:100%;background:var(--viz-series-1)}
#shade-route-viewer .sr-count-value{text-align:right}
#shade-route-viewer .sr-swatches{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0 10px}
#shade-route-viewer .sr-swatches&gt;span{display:flex;align-items:center;gap:9px}
#shade-route-viewer .sr-swatch{width:38px;height:38px;display:inline-block;outline:1px solid var(--border);flex:none}
#shade-route-viewer .sr-lab{min-height:24px}
#shade-route-viewer .sr-camera{margin-top:8px;justify-content:flex-start}
#shade-route-viewer .sr-legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:20px}
#shade-route-viewer .sr-legend&gt;span{display:inline-flex;align-items:center;gap:7px}
#shade-route-viewer .sr-line-key{display:inline-block;width:24px;height:3px;background:var(--viz-series-1)}
#shade-route-viewer .sr-ring-key{width:14px;height:14px;display:inline-block;border:2px solid var(--viz-series-1);border-radius:50%}
#shade-route-viewer #sr-colour{touch-action:none}
#shade-route-viewer .sr-plot,#shade-route-viewer .sr-distance{position:relative}
#shade-route-viewer .sr-tip{position:absolute;pointer-events:none;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);padding:7px 10px;max-width:min(320px,90%);z-index:2;white-space:pre-line}
#shade-route-viewer details{margin-top:14px}
@media(min-width:1500px){#shade-route-viewer .sr-plot{height:600px}}
@media(max-width:1050px){#shade-route-viewer .sr-pickers{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:850px){#shade-route-viewer .sr-spaces{grid-template-columns:minmax(0,1fr);gap:26px}#shade-route-viewer .sr-plot{height:410px}#shade-route-viewer .sr-live-monitor{grid-template-columns:minmax(0,1fr);gap:12px}}
@media(max-width:480px){#shade-route-viewer{padding:4px 0 18px}#shade-route-viewer .sr-pickers{grid-template-columns:minmax(0,1fr)}#shade-route-viewer .sr-plot{height:360px}#shade-route-viewer .sr-distance{height:200px}#shade-route-viewer .sr-playback-controls{grid-template-columns:minmax(0,1fr) minmax(95px,130px)}#shade-route-viewer #sr-play-state{grid-column:1/-1}}
